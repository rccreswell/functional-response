# Pinned environment for reproducing the functional-response analysis.
# Create with:   conda env create -f environment.yml
# Activate with: conda activate functional-response
# For a fully-locked, cross-platform pin also run:  conda-lock -f environment.yml
# Versions match the machine the results were produced on (Python 3.9.7, macOS x86_64).
name: functional-response
channels:
  - conda-forge
dependencies:
  - python=3.9.7
  - numpy=1.20.3
  - scipy=1.7.1
  - pandas=1.3.4
  - matplotlib-base=3.4.3
  - joblib=1.1.0
  - arviz=0.11.2
  - snakemake-minimal>=7,<8
  - pip
  - pip:
      - pints==0.5.0
